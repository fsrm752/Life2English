name: 发布侧基础检查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-check:
    name: 静态检查 + 程序回归
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 YAML 校验辅助（可选增强；失败显式告警，不静默）
        run: |
          if python -m pip install --quiet pyyaml; then
            echo "PyYAML 就绪：frontmatter 将用权威解析器校验"
          else
            echo "::warning::PyYAML 安装失败——frontmatter 退回内置严格子集引擎（断言数量不减，实际引擎会在输出中标注）"
          fi

      # 第一层：静态结构检查（frontmatter / 引用 / 场景数据完整性 / 编译 / 协议冒烟）
      - name: 静态结构自检（package_check.py）
        run: python .github/checks/package_check.py

      # 第二层：程序回归测试（协议字段契约 / 跨操作一致性 / 错误路径 / 数据边界 / 档案往返）
      - name: 程序回归测试（regression_check.py）
        run: python .github/checks/regression_check.py

      # 第三层（教学质量 LLM 评估）不在此运行：需模型环境 + 人工评分，无法在
      # 无人值守 CI 完成；评估集与量表见开发工作区 tests/eval_trackA_cases.md，
      # 由维护者在模型环境中人工执行并归档。
